name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore HelpQueue.sln

      - name: Build
        run: dotnet build HelpQueue.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test HelpQueue.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Api image
        run: docker build -f src/HelpQueue.Api/Dockerfile -t helpqueue-api:ci .

      - name: Build Web image
        run: docker build -f src/HelpQueue.Web/Dockerfile -t helpqueue-web:ci .
